    const AVATARS = ["😎", "🦊", "🐱", "🚀", "🐼", "🦁", "🐸", "🦄"];

    // =========================================================================
    // 5. WEB AUDIO SES MOTORU (KALP ATIŞI, ALKIŞ, CIRCIR BÖCEĞİ, TIKLAMA)
    // =========================================================================
    const SoundFX = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      },
      play(type) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (type === "tick") {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(520, now);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.09);
          } else if (type === "heartbeat") {
            [0, 0.16].forEach(offset => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "triangle";
              osc.frequency.setValueAtTime(95, now + offset);
              g.gain.setValueAtTime(0.22, now + offset);
              g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
              osc.connect(g); g.connect(this.ctx.destination);
              osc.start(now + offset); osc.stop(now + offset + 0.13);
            });
          } else if (type === "applause") {
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "triangle";
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);
              g.gain.setValueAtTime(0.14, now + idx * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
              osc.connect(g); g.connect(this.ctx.destination);
              osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.26);
            });
          } else if (type === "cricket") {
            [0, 0.12, 0.24].forEach(offset => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(4200, now + offset);
              g.gain.setValueAtTime(0.06, now + offset);
              g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.07);
              osc.connect(g); g.connect(this.ctx.destination);
              osc.start(now + offset); osc.stop(now + offset + 0.08);
            });
          }
        } catch (e) {}
      }
    };

    // =========================================================================
    // 6. UYGULAMA DURUMU (STATE)
    // =========================================================================
    const state = {
      screen: "home", // home, howto, profile, online_choice, join_room, setup_score, setup_category, setup_pack, bot_lobby, lobby, qr_modal, round_intro, custom_prompt, picking, waiting_picks, timeout_pass, voting, reveal, sudden_death, podium, badges, story_card
      showExitModal: false,
      mode: "bot", // 'online' | 'bot'
      myId: crypto.randomUUID ? crypto.randomUUID() : "p_" + Math.random().toString(36).substring(2, 11),
      playerName: "",
      playerAvatar: "😎",
      nameError: "",

      // Oda ve Kurulum
      roomCode: "",
      joinInput: "",
      joinError: "",
      isAdmin: false,
      targetScore: 3000,
      selectedCategory: "mizah",
      selectedPack: "turk_mizah",

      // Oyun İçi Veriler
      currentRound: 1,
      currentSituation: "",
      customPromptText: "",
      timer: 20,
      botLobbyTimer: 10,
      hand: [],
      selectedCardId: null,
      hasSubmittedCard: false,
      votedPlayerId: null,
      usedSituations: [],

      // Jokerler
      jokerRefreshUsed: false,
      jokerDoubleUsed: false,
      jokerDoubleActive: false,

      // Oyuncular Listesi
      players: [],
      suddenDeathFinalists: [],
      bestMoment: {
        situation: "Diyete pazartesi başlayıp salı öğlen İskender gömmem.",
        card: MEME_CARDS[0],
        winnerName: "Cem",
        votes: 2
      }
    };

    let mainInterval = null;
    let botTimeoutIds = [];
    let realtimeChannel = null;

    // =========================================================================
    // 7. YARDIMCI FONKSİYONLAR VE DOĞRULAMALAR
    // =========================================================================
    function clearAllTimers() {
      if (mainInterval) clearInterval(mainInterval);
      mainInterval = null;
      botTimeoutIds.forEach(id => clearTimeout(id));
      botTimeoutIds = [];
    }

    // İsim Kuralı: En az 3 karakter, harf ve sayı olabilir, noktalama işareti yasak
    function sanitizePlayerName(val) {
      return val.replace(/[^a-zA-Z0-9ğüşıöçĞÜŞİÖÇ ]/g, "").slice(0, 16);
    }

    function isValidPlayerName(name) {
      const cleaned = name.trim();
      return cleaned.length >= 3 && /^[a-zA-Z0-9ğüşıöçĞÜŞİÖÇ ]+$/.test(cleaned);
    }

    function getRandomHand(excludeIds = []) {
      const pool = MEME_CARDS.filter(c => !excludeIds.includes(c.id));
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 4);
    }

    function getNextSituation() {
      const available = SITUATIONS.filter(s => !state.usedSituations.includes(s));
      const pool = available.length > 0 ? available : SITUATIONS;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      state.usedSituations.push(chosen);
      return chosen;
    }

    function getCardById(id) {
      return MEME_CARDS.find(c => c.id === id) || MEME_CARDS[0];
    }

    function spawnEmoji(emoji) {
      const app = document.getElementById("app");
      if (!app) return;
      const el = document.createElement("div");
      el.className = "flying-emoji";
      el.style.left = (15 + Math.random() * 70) + "%";
      el.textContent = emoji;
      app.appendChild(el);
      SoundFX.play("tick");
      setTimeout(() => el.remove(), 1700);

      if (state.mode === "online" && realtimeChannel) {
        realtimeChannel.send({
          type: "broadcast",
          event: "emoji",
          payload: { emoji }
        });
      }
    }

    // =========================================================================
    // 8. ANA MENÜYE ÇIKIŞ (SOL ÜST LOGO VEYA SAĞ ÜST ÇIKIŞ İKONU)
    // =========================================================================
    function requestExitToMenu() {
      if (state.screen === "home") return;
      state.showExitModal = true;
      render();
    }

    async function confirmExitToMenu() {
      clearAllTimers();
      if (state.mode === "online" && state.roomCode) {
        try {
          await sb.from("players").delete().eq("id", state.myId);
        } catch (e) {}
      }
      if (realtimeChannel) {
        sb.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
      state.showExitModal = false;
      state.roomCode = "";
      state.joinInput = "";
      state.currentRound = 1;
      state.jokerRefreshUsed = false;
      state.jokerDoubleUsed = false;
      state.jokerDoubleActive = false;
      state.screen = "home";
      render();
    }

    // =========================================================================
    // 9. BOT MODU (ALİ, MEHMET, OSMAN) VE 10 SN LOBİ SAYACI
    // =========================================================================
    function startBotLobby() {
      clearAllTimers();
      state.isAdmin = true;
      state.roomCode = String(Math.floor(100000 + Math.random() * 900000));
      state.currentRound = 1;
      state.jokerRefreshUsed = false;
      state.jokerDoubleUsed = false;
      state.jokerDoubleActive = false;
      state.usedSituations = [];

      state.players = [
        { id: state.myId, name: state.playerName, avatar: state.playerAvatar, is_admin: true, is_bot: false, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 0, max_votes_in_single_round: 0 },
        { id: "bot_ali", name: "Ali", avatar: "🤖", is_admin: false, is_bot: true, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 1, max_votes_in_single_round: 0 },
        { id: "bot_mehmet", name: "Mehmet", avatar: "🤖", is_admin: false, is_bot: true, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 0, max_votes_in_single_round: 0 },
        { id: "bot_osman", name: "Osman", avatar: "🤖", is_admin: false, is_bot: true, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 0, max_votes_in_single_round: 0 }
      ];

      state.botLobbyTimer = 10;
      state.screen = "bot_lobby";
      render();

      mainInterval = setInterval(() => {
        state.botLobbyTimer--;
        SoundFX.play("tick");
        if (state.botLobbyTimer <= 0) {
          clearAllTimers();
          startNewRound();
        } else {
          render();
        }
      }, 1000);
    }

    // =========================================================================
    // 10. ÇEVRİMİÇİ (SUPABASE REALTIME) ODA KURMA & KATILMA
    // =========================================================================
    async function createOnlineRoom() {
      const code = String(Math.floor(100000 + Math.random() * 900000));
      state.roomCode = code;
      state.isAdmin = true;
      state.currentRound = 1;
      const firstSituation = getNextSituation();

      try {
        await sb.from("rooms").insert({
          code: code,
          admin_id: state.myId,
          status: "lobby",
          target_score: state.targetScore,
          main_category: state.selectedCategory,
          sub_pack: state.selectedPack,
          current_round: 1,
          current_situation: firstSituation
        });

        await sb.from("players").insert({
          id: state.myId,
          room_code: code,
          name: state.playerName,
          avatar: state.playerAvatar,
          is_admin: true,
          is_bot: false,
          score: 0
        });

        subscribeToRoom(code);
        await fetchRoomData(code);
        state.screen = "lobby";
        render();
      } catch (err) {
        alert("Oda kurulurken bağlantı hatası oluştu: " + err.message);
      }
    }

    async function joinOnlineRoom() {
      if (state.joinInput.length !== 6) {
        state.joinError = "Lütfen 6 haneli sayısal oda kodunu eksiksiz girin.";
        render();
        return;
      }
      try {
        const { data: room, error } = await sb.from("rooms").select("*").eq("code", state.joinInput).single();
        if (error || !room) {
          state.joinError = "Bu koda ait aktif bir oda bulunamadı!";
          render();
          return;
        }
        state.roomCode = room.code;
        state.isAdmin = false;
        state.targetScore = room.target_score;
        state.selectedCategory = room.main_category;
        state.selectedPack = room.sub_pack;

        await sb.from("players").upsert({
          id: state.myId,
          room_code: room.code,
          name: state.playerName,
          avatar: state.playerAvatar,
          is_admin: false,
          is_bot: false,
          score: 0
        });

        subscribeToRoom(room.code);
        await fetchRoomData(room.code);
        state.screen = "lobby";
        render();
      } catch (e) {
        state.joinError = "Odaya katılırken hata oluştu.";
        render();
      }
    }

    async function fetchRoomData(code) {
      const { data: room } = await sb.from("rooms").select("*").eq("code", code).single();
      const { data: players } = await sb.from("players").select("*").eq("room_code", code).order("joined_at", { ascending: true });
      if (players) state.players = players;
      if (room) {
        state.targetScore = room.target_score;
        state.selectedCategory = room.main_category;
        state.selectedPack = room.sub_pack;
        state.currentRound = room.current_round;
        state.currentSituation = room.current_situation || SITUATIONS[0];
        syncOnlineScreenWithStatus(room.status);
      }
    }

    function subscribeToRoom(code) {
      if (realtimeChannel) sb.removeChannel(realtimeChannel);
      realtimeChannel = sb.channel("room_" + code)
        .on("postgres_changes", { event: "*", schema: "public", table: "rooms", filter: "code=eq." + code }, payload => {
          fetchRoomData(code);
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: "room_code=eq." + code }, payload => {
          fetchRoomData(code);
        })
        .on("broadcast", { event: "emoji" }, payload => {
          if (payload.payload && payload.payload.emoji) {
            const app = document.getElementById("app");
            const el = document.createElement("div");
            el.className = "flying-emoji";
            el.style.left = (15 + Math.random() * 70) + "%";
            el.textContent = payload.payload.emoji;
            app.appendChild(el);
            setTimeout(() => el.remove(), 1700);
          }
        })
        .subscribe();
    }

    function syncOnlineScreenWithStatus(status) {
      if (status === "lobby" && state.screen !== "lobby" && state.screen !== "qr_modal") {
        state.screen = "lobby";
        render();
      } else if (status === "picking" && !["picking", "waiting_picks", "timeout_pass"].includes(state.screen)) {
        beginPickingPhaseUI();
      } else if (status === "voting" && state.screen !== "voting") {
        beginVotingPhaseUI();
      } else if (status === "reveal" && state.screen !== "reveal") {
        beginRevealPhaseUI();
      } else if (status === "finished" && !["podium", "badges", "story_card"].includes(state.screen)) {
        state.screen = "podium";
        render();
      } else {
        render();
      }
    }

    // =========================================================================
    // 11. OYUN DÖNGÜSÜ: TUR BAŞLANGICI, 20 SN KART SEÇİMİ, 10 SN OYLAMA, +300 PUAN
    // =========================================================================
    async function startNewRound() {
      clearAllTimers();
      state.selectedCardId = null;
      state.hasSubmittedCard = false;
      state.votedPlayerId = null;
      state.jokerDoubleActive = false;
      state.hand = getRandomHand();

      // Oyuncu seçimlerini sıfırla
      state.players.forEach(p => {
        p.selected_card_id = null;
        p.voted_for_player_id = null;
        p.joker_double_active = false;
      });

      // Her 5 turda bir "Kendi Durumunu Yaz" Serbest Turu
      if (state.currentRound > 1 && state.currentRound % 5 === 0 && state.isAdmin) {
        state.customPromptText = "";
        state.screen = "custom_prompt";
        state.timer = 15;
        render();
        mainInterval = setInterval(() => {
          state.timer--;
          if (state.timer <= 0) {
            clearAllTimers();
            state.currentSituation = state.customPromptText.trim() || getNextSituation();
            proceedToRoundIntro();
          } else {
            render();
          }
        }, 1000);
        return;
      }

      state.currentSituation = getNextSituation();
      proceedToRoundIntro();
    }

    async function proceedToRoundIntro() {
      clearAllTimers();
      if (state.mode === "online" && state.isAdmin) {
        await sb.from("players").update({ selected_card_id: null, voted_for_player_id: null, joker_double_active: false }).eq("room_code", state.roomCode);
        await sb.from("rooms").update({
          status: "picking",
          current_round: state.currentRound,
          current_situation: state.currentSituation
        }).eq("code", state.roomCode);
      }

      state.screen = "round_intro";
      render();
      setTimeout(() => {
        beginPickingPhaseUI();
      }, 1800);
    }

    function beginPickingPhaseUI() {
      clearAllTimers();
      if (state.hand.length === 0) state.hand = getRandomHand();
      state.selectedCardId = null;
      state.hasSubmittedCard = false;
      state.votedPlayerId = null;
      state.timer = 20; // Ortadaki karta göre kart atma süremiz 20 saniye
      state.screen = "picking";
      render();

      // Botlarla Oyna modunda Ali, Mehmet ve Osman kesinlikle kart seçimi yapar
      if (state.mode === "bot") {
        const bots = state.players.filter(p => p.is_bot);
        bots.forEach((bot, idx) => {
          const delay = (idx === 0 ? 3500 : idx === 1 ? 6500 : 11000);
          const tid = setTimeout(() => {
            const usedIds = state.players.map(p => p.selected_card_id).filter(Boolean);
            const available = MEME_CARDS.filter(c => !usedIds.includes(c.id));
            const randomCard = available[Math.floor(Math.random() * available.length)] || MEME_CARDS[idx];
            bot.selected_card_id = randomCard.id;
            if (state.screen === "waiting_picks") render();
          }, delay);
          botTimeoutIds.push(tid);
        });
      }

      // 20 Saniyelik Gerçek Sayaç (Kart seçilince sıfırlanmaz, arkada işler)
      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 5 && state.timer > 0) SoundFX.play("heartbeat");
        else if (state.timer > 5) SoundFX.play("tick");

        if (state.timer <= 0) {
          clearAllTimers();
          // Botların hepsi seçmiş olduğundan emin ol
          if (state.mode === "bot") {
            state.players.filter(p => p.is_bot).forEach((bot, idx) => {
              if (!bot.selected_card_id) bot.selected_card_id = MEME_CARDS[(idx + 2) % MEME_CARDS.length].id;
            });
          }

          if (!state.hasSubmittedCard) {
            // Süre bittiğinde kart seçmeyen kullanıcı pas geçer ve oy veremez
            state.screen = "timeout_pass";
            render();
            setTimeout(() => {
              triggerVotingPhase();
            }, 2200);
          } else {
            triggerVotingPhase();
          }
        } else {
          render();
        }
      }, 1000);
    }

    async function submitSelectedCard() {
      if (!state.selectedCardId || state.hasSubmittedCard) return;
      state.hasSubmittedCard = true;
      if (state.jokerDoubleActive) state.jokerDoubleUsed = true;

      const me = state.players.find(p => p.id === state.myId);
      if (me) {
        me.selected_card_id = state.selectedCardId;
        me.joker_double_active = state.jokerDoubleActive;
        if (state.timer <= 3) me.last_second_picks = (me.last_second_picks || 0) + 1;
      }

      if (state.mode === "online") {
        await sb.from("players").update({
          selected_card_id: state.selectedCardId,
          joker_double_active: state.jokerDoubleActive
        }).eq("id", state.myId);
      }

      // Süre sıfırlanmaz, diğer oyuncular ve sürenin bitişi beklenir
      state.screen = "waiting_picks";
      render();
    }

    async function triggerVotingPhase() {
      if (state.mode === "online" && state.isAdmin) {
        await sb.from("rooms").update({ status: "voting" }).eq("code", state.roomCode);
      }
      beginVotingPhaseUI();
    }

    function beginVotingPhaseUI() {
      clearAllTimers();
      state.votedPlayerId = null;
      state.timer = 10; // Oyuncuların kartını oylama süremiz 10 saniye
      state.screen = "voting";
      render();

      // Botlar oylama aşamasında kendi kartları hariç rastgele oy verir
      if (state.mode === "bot") {
        const activePlayers = state.players.filter(p => p.selected_card_id);
        state.players.filter(p => p.is_bot).forEach((bot, i) => {
          const tid = setTimeout(() => {
            const candidates = activePlayers.filter(p => p.id !== bot.id);
            if (candidates.length > 0) {
              const target = candidates[Math.floor(Math.random() * candidates.length)];
              bot.voted_for_player_id = target.id;
            }
          }, 2000 + i * 1500);
          botTimeoutIds.push(tid);
        });
      }

      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 4 && state.timer > 0) SoundFX.play("heartbeat");
        if (state.timer <= 0) {
          clearAllTimers();
          triggerRevealPhase();
        } else {
          render();
        }
      }, 1000);
    }

    async function castVote(targetPlayerId) {
      // Kart seçmeyen oyuncu oy veremez, kendi kartına oy veremez
      if (!state.hasSubmittedCard || state.votedPlayerId || targetPlayerId === state.myId) return;
      state.votedPlayerId = targetPlayerId;
      const me = state.players.find(p => p.id === state.myId);
      if (me) me.voted_for_player_id = targetPlayerId;
      SoundFX.play("tick");

      if (state.mode === "online") {
        await sb.from("players").update({ voted_for_player_id: targetPlayerId }).eq("id", state.myId);
      }
      render();
    }

    async function triggerRevealPhase() {
      // Her alınan oy başına +300 puan hesaplaması (2x Risk aktifse +600, 0 oy ise -300)
      const voteCounts = {};
      state.players.forEach(p => { voteCounts[p.id] = 0; });
      state.players.forEach(p => {
        if (p.voted_for_player_id && voteCounts[p.voted_for_player_id] !== undefined) {
          voteCounts[p.voted_for_player_id]++;
        }
      });

      state.players.forEach(p => {
        const votes = voteCounts[p.id] || 0;
        p.roundVotes = votes;
        let delta = votes * 300;
        if (p.joker_double_active) {
          delta = votes > 0 ? votes * 600 : -300;
        }
        p.roundDelta = delta;
        p.score = Math.max(0, (p.score || 0) + delta);

        // Rozet istatistikleri
        if (votes === 0) p.zero_vote_rounds = (p.zero_vote_rounds || 0) + 1;
        if (votes > (p.max_votes_in_single_round || 0)) p.max_votes_in_single_round = votes;

        // En komik an kaydı
        if (votes >= (state.bestMoment.votes || 0) && p.selected_card_id) {
          state.bestMoment = {
            situation: state.currentSituation,
            card: getCardById(p.selected_card_id),
            winnerName: p.name,
            votes: votes
          };
        }
      });

      if (state.mode === "online" && state.isAdmin) {
        for (const p of state.players) {
          await sb.from("players").update({ score: p.score }).eq("id", p.id);
        }
        await sb.from("rooms").update({ status: "reveal" }).eq("code", state.roomCode);
      }

      beginRevealPhaseUI();
    }

    function beginRevealPhaseUI() {
      clearAllTimers();
      state.screen = "reveal";
      state.timer = 6;

      // En yüksek oy varsa alkış, 0 oy varsa cırcır böceği
      const anyVotes = state.players.some(p => (p.roundVotes || 0) > 0);
      SoundFX.play(anyVotes ? "applause" : "cricket");
      render();

      // "Sonraki Tura Geç" butonu yok! Sistem otomatik geçer.
      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 0) {
          clearAllTimers();
          checkEndOfGameOrNextRound();
        } else {
          render();
        }
      }, 1000);
    }

    async function checkEndOfGameOrNextRound() {
      const winners = state.players.filter(p => p.score >= state.targetScore);
      if (winners.length > 1) {
        // Beraberlik Bozucu Altın Tur (Sudden Death)
        const sorted = [...winners].sort((a, b) => b.score - a.score);
        if (sorted[0].score === sorted[1].score) {
          state.suddenDeathFinalists = [sorted[0], sorted[1]];
          startSuddenDeathDuel();
          return;
        }
      }
      if (winners.length >= 1) {
        if (state.mode === "online" && state.isAdmin) {
          await sb.from("rooms").update({ status: "finished" }).eq("code", state.roomCode);
        }
        SoundFX.play("applause");
        state.screen = "podium";
        render();
        return;
      }

      state.currentRound++;
      startNewRound();
    }

    function startSuddenDeathDuel() {
      clearAllTimers();
      state.screen = "sudden_death";
      state.timer = 10;
      state.currentSituation = getNextSituation();
      render();

      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 0) {
          clearAllTimers();
          // Finalistlerden birine +300 altın puan eklenir
          state.suddenDeathFinalists[0].score += 300;
          state.screen = "podium";
          SoundFX.play("applause");
          render();
        } else {
          render();
        }
      }, 1000);
    }

    // =========================================================================
    // 13. INSTAGRAM STORY "EFSANE AN" KARTINI PNG OLARAK İNDİRME
    // =========================================================================
    function downloadStoryCard() {
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, 0, 1920);
      grad.addColorStop(0, "#2E1065");
      grad.addColorStop(0.5, "#0F172A");
      grad.addColorStop(1, "#09090F");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.fillStyle = "#C084FC";
      ctx.font = "bold 46px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🎮 MODUNU BUL • MAÇIN EFSANE ANI", 540, 220);

      // Durum kutusu
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(90, 320, 900, 320);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 42px sans-serif";
      ctx.fillText(state.bestMoment.situation.slice(0, 42), 540, 460);
      if (state.bestMoment.situation.length > 42) {
        ctx.fillText(state.bestMoment.situation.slice(42, 84), 540, 525);
      }

      // Meme Emojisi ve Başlığı
      ctx.font = "180px sans-serif";
      ctx.fillText(state.bestMoment.card.emoji, 540, 980);
      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold 54px sans-serif";
      ctx.fillText(state.bestMoment.card.title, 540, 1160);

      ctx.fillStyle = "#FBBF24";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("👑 Kazanan: " + state.bestMoment.winnerName + " (+" + (state.bestMoment.votes * 300) + " Puan)", 540, 1450);

      ctx.fillStyle = "#71717A";
      ctx.font = "32px sans-serif";
      ctx.fillText("© 2026 Modunu Bul.", 540, 1780);

      const link = document.createElement("a");
      link.download = "modunu-bul-efsane-an.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

                  <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center text-xl">${card ? card.emoji : '⌛'}</div>
                    <div>
                      <div class="text-xs font-extrabold">${p.avatar}${p.name} <span class="text-[10px] text-emerald-400">(${p.roundVotes || 0} Oy)</span></div>
                      <div class="text-[10px] text-zinc-400">${card ? card.title : 'Kart Seçmedi'} • Toplam: <strong>${p.score} Puan</strong></div>
                    </div>
                  </div>
                  <span class="text-xs font-extrabold ${(p.roundDelta || 0) >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                    ${(p.roundDelta || 0) >= 0 ? '+' + (p.roundDelta || 0) : p.roundDelta}
                  </span>
                </div>
              `;
            }).join("")}
          </div>

          <div class="space-y-1">
            <div class="text-center text-[10px] text-purple-300 font-bold">${state.timer} sn içinde sonraki tura otomatik geçiliyor...</div>
            <div class="w-full h-1.5 rounded-full bg-zinc-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-purple-500 to-sky-400" style="width:${(state.timer / 6) * 100}%"></div>
            </div>
          </div>
        `;
      }

      // 19. BERABERLİK BOZUCU ALTIN TUR (SUDDEN DEATH)
      else if (state.screen === "sudden_death") {
        const [f1, f2] = state.suddenDeathFinalists;
        html = `
          ${renderTopGameHeader("⚡ ALTIN TUR • " + state.timer + " SN")}
          <div class="my-auto p-5 rounded-3xl glass-card neon-border-amber text-center space-y-4">
            <span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-extrabold">BERABERLİK BOZUCU FİNAL DÜELLOSU</span>
            <div class="grid grid-cols-3 items-center">
              <div>
                <div class="text-3xl">${f1.avatar}</div>
                <div class="text-xs font-extrabold mt-1">${f1.name}</div>
                <div class="text-[10px] text-amber-300">${f1.score}</div>
              </div>
              <div class="text-2xl font-extrabold text-amber-400">⚡ VS ⚡</div>
              <div>
                <div class="text-3xl">${f2.avatar}</div>
                <div class="text-xs font-extrabold mt-1">${f2.name}</div>
                <div class="text-[10px] text-amber-300">${f2.score}</div>
              </div>
            </div>
            <p class="text-xs text-zinc-300">${state.currentSituation}</p>
          </div>
          <div class="text-center text-xs text-amber-300 font-bold">Şampiyon belirleniyor...</div>
        `;
      }

      // 20. ŞAMPİYONLAR PODYUMU (1., 2. VE 3. SIRALAMA - KRAL TACI İSMİ KAPATMAZ)
      else if (state.screen === "podium") {
        const ranked = [...state.players].sort((a, b) => b.score - a.score);
        const first = ranked[0] || { name: "-", avatar: "😎", score: 0 };
        const second = ranked[1] || { name: "-", avatar: "🤖", score: 0 };
        const third = ranked[2] || { name: "-", avatar: "🤖", score: 0 };

        html = `
          <div class="flex items-center justify-between">
            <button onclick="requestExitToMenu()" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">🎮</button>
            <span class="text-[10px] font-bold text-amber-300 tracking-wider uppercase">🏆 OYUN SONA ERDİ</span>
            <button onclick="requestExitToMenu()" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs text-rose-400">✕</button>
          </div>

          <div class="text-center">
            <h2 class="text-2xl font-extrabold">ŞAMPİYONLAR</h2>
            <p class="text-[11px] text-zinc-400">Hedeflenen ${state.targetScore} puana ulaşıldı!</p>
          </div>

          <div class="grid grid-cols-3 gap-2 items-end pt-4 my-auto text-center">
            <!-- 2. Oyuncu -->
            <div class="flex flex-col items-center">
              <div class="w-12 h-12 rounded-full glass-card border border-sky-400 flex items-center justify-center text-xl">${second.avatar}</div>
              <div class="text-xs font-bold mt-1.5 truncate max-w-full">${second.name}</div>
              <div class="text-[10px] text-sky-300 font-extrabold mb-1.5">${second.score}</div>
              <div class="w-full h-20 rounded-t-2xl glass-card flex flex-col items-center justify-center">
                <span class="text-xl font-extrabold">2</span>
                <span class="text-[8px] text-zinc-400">İKİNCİ</span>
              </div>
            </div>

            <!-- 1. Şampiyon (Kral Tacı En Üstte, İsim Aşağıda Net Görünür) -->
            <div class="flex flex-col items-center">
              <span class="text-2xl mb-1 drop-shadow-[0_0_10px_rgba(251,191,36,0.9)]">👑</span>
              <div class="w-14 h-14 rounded-full bg-purple-500/30 neon-border-purple flex items-center justify-center text-2xl">${first.avatar}</div>
              <div class="text-xs font-extrabold text-amber-300 mt-1.5 truncate max-w-full">${first.name}</div>
              <div class="text-[11px] text-white font-extrabold mb-1.5">${first.score}</div>
              <div class="w-full h-28 rounded-t-2xl bg-gradient-to-b from-purple-600/80 to-indigo-950 neon-border-purple flex flex-col items-center justify-center">
                <span class="text-2xl font-extrabold">1</span>
                <span class="text-[8px] text-purple-200 font-bold tracking-wider">ŞAMPİYON</span>
              </div>
            </div>

            <!-- 3. Oyuncu -->
            <div class="flex flex-col items-center">
              <div class="w-12 h-12 rounded-full glass-card border border-zinc-600 flex items-center justify-center text-xl">${third.avatar}</div>
              <div class="text-xs font-bold mt-1.5 truncate max-w-full">${third.name}</div>
              <div class="text-[10px] text-zinc-400 font-extrabold mb-1.5">${third.score}</div>
              <div class="w-full h-16 rounded-t-2xl glass-card flex flex-col items-center justify-center">
                <span class="text-xl font-extrabold">3</span>
                <span class="text-[8px] text-zinc-400">ÜÇÜNCÜ</span>
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="state.screen='badges'; render();" class="py-2.5 rounded-xl glass-card text-[11px] font-bold text-purple-300">🏅 Gece Rozetleri</button>
              <button onclick="state.screen='story_card'; render();" class="py-2.5 rounded-xl glass-card text-[11px] font-bold text-sky-300">📸 Efsane An</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="confirmExitToMenu()" class="py-2.5 rounded-xl glass-card text-xs font-bold">Ana Menü</button>
              <button onclick="if(state.mode==='bot'){ startBotLobby(); } else { state.players.forEach(p=>p.score=0); startNewRound(); }" class="py-2.5 rounded-xl btn-primary text-xs">↻ Tekrar Oyna</button>
            </div>
          </div>
        `;
      }

      // 21. MAÇ SONU ROZETLER EKRANI
      else if (state.screen === "badges") {
        const sortedByScore = [...state.players].sort((a, b) => b.score - a.score);
        const mizahsor = sortedByScore[0] || state.players[0];
        const sonSaniye = [...state.players].sort((a, b) => (b.last_second_picks || 0) - (a.last_second_picks || 0))[0] || state.players[0];
        const buzdolabi = [...state.players].sort((a, b) => (b.zero_vote_rounds || 0) - (a.zero_vote_rounds || 0))[0] || state.players[0];

        html = `
          <div class="flex items-center justify-between">
            <button onclick="state.screen='podium'; render();" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">←</button>
            <span class="text-xs font-bold">🏅 Maç Sonu Unvanları</span>
            <button onclick="requestExitToMenu()" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">🎮</button>
          </div>

          <div class="space-y-2.5 my-auto">
            <div class="p-3 rounded-2xl glass-card neon-border-purple flex items-center gap-3">
              <div class="text-3xl">🎯</div>
              <div>
                <div class="text-xs font-extrabold text-purple-300">Gecenin Mizahşörü • ${mizahsor.name}</div>
                <p class="text-[10px] text-zinc-400">En yüksek oyları toplayarak masayı kahkahaya boğdu.</p>
              </div>
            </div>
            <div class="p-3 rounded-2xl glass-card neon-border-emerald flex items-center gap-3">
              <div class="text-3xl">🐢</div>
              <div>
                <div class="text-xs font-extrabold text-emerald-300">Son Saniye Uzmanı • ${sonSaniye.name}</div>
                <p class="text-[10px] text-zinc-400">Kartlarını son saniyelerde göndererek heyecan yarattı.</p>
              </div>
            </div>
            <div class="p-3 rounded-2xl glass-card neon-border-blue flex items-center gap-3">
              <div class="text-3xl">🧊</div>
              <div>
                <div class="text-xs font-extrabold text-sky-300">Buzdolabı • ${buzdolabi.name}</div>
                <p class="text-[10px] text-zinc-400">En çok 0 oy çekerek masayı derin düşüncelere sevk etti.</p>
              </div>
            </div>
          </div>

          <button onclick="state.screen='podium'; render();" class="w-full py-3 rounded-2xl btn-primary text-xs">← Podyuma Geri Dön</button>
        `;
      }

      // 22. EFSANE AN PAYLAŞIM KARTI EKRANI
      else if (state.screen === "story_card") {
        html = `
          <div class="flex items-center justify-between">
            <button onclick="state.screen='podium'; render();" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">←</button>
            <span class="text-xs font-bold">📸 Maçın Efsane Anı</span>
            <button onclick="requestExitToMenu()" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">🎮</button>
          </div>

          <div class="my-auto p-4 rounded-3xl bg-gradient-to-b from-purple-900/90 via-indigo-950 to-zinc-950 neon-border-purple space-y-3 text-center">
            <div class="flex justify-between text-[10px] text-purple-200 font-bold">
              <span>🎮 MODUNU BUL • 2026</span>
              <span class="px-2 py-0.5 rounded-full bg-amber-400 text-black font-extrabold">🔥 EN KOMİK AN</span>
            </div>
            <div class="p-3 rounded-xl bg-black/40 text-left text-xs font-bold">"${state.bestMoment.situation}"</div>
            <div class="h-32 rounded-2xl bg-zinc-900/90 flex flex-col items-center justify-center p-2">
              <span class="text-4xl">${state.bestMoment.card.emoji}</span>
              <span class="text-xs font-extrabold text-purple-200 mt-2">${state.bestMoment.card.title}</span>
            </div>
            <div class="flex justify-between text-xs pt-1 border-t border-white/10">
              <span class="font-extrabold text-amber-300">👑 ${state.bestMoment.winnerName}</span>
              <span class="text-emerald-400 font-extrabold">+${(state.bestMoment.votes || 1) * 300} Puan</span>
            </div>
          </div>

          <div class="space-y-2">
            <button onclick="downloadStoryCard()" class="w-full py-3 rounded-2xl btn-primary text-xs">📸 Hikaye Kartını İndir (PNG)</button>
            <button onclick="state.screen='podium'; render();" class="w-full py-2.5 rounded-xl glass-card text-xs">← Podyuma Geri Dön</button>
          </div>
        `;
      }

      // ÇIKIŞ ONAYI MODAL (HER EKRANDA AKTİF)
      if (state.showExitModal) {
        html += `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
            <div class="w-full max-w-xs p-5 rounded-3xl glass-card neon-border-purple text-center space-y-3">
              <div class="w-12 h-12 mx-auto rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-2xl">🚪</div>
              <h3 class="text-base font-extrabold">Ana Menüye Dönmek İstediğine Emin Misin?</h3>
              <p class="text-xs text-zinc-400">Aktif oyundan ayrılırsan bu maçtaki puanların sıfırlanır.</p>
              <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="confirmExitToMenu()" class="py-2.5 rounded-xl bg-rose-500 text-black font-extrabold text-xs">Evet, Çık</button>
                <button onclick="state.showExitModal=false; render();" class="py-2.5 rounded-xl glass-card text-white font-bold text-xs">Hayır, Kal</button>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    // Oyunu Başlat
    render();
  </script>
</body>
</html>
