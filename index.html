    const SoundFX = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
      },
      play(type) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (type === "tick") {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(540, now);
            g.gain.setValueAtTime(0.06, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.08);
          } else if (type === "heartbeat") {
            [0, 0.15].forEach(offset => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "triangle";
              osc.frequency.setValueAtTime(98, now + offset);
              g.gain.setValueAtTime(0.18, now + offset);
              g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.11);
              osc.connect(g); g.connect(this.ctx.destination);
              osc.start(now + offset); osc.stop(now + offset + 0.12);
            });
          } else if (type === "applause") {
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "triangle";
              osc.frequency.setValueAtTime(freq, now + idx * 0.075);
              g.gain.setValueAtTime(0.13, now + idx * 0.075);
              g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.24);
              osc.connect(g); g.connect(this.ctx.destination);
              osc.start(now + idx * 0.075); osc.stop(now + idx * 0.075 + 0.25);
            });
          } else if (type === "cricket") {
            [0, 0.12, 0.24].forEach(offset => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(4100, now + offset);
              g.gain.setValueAtTime(0.05, now + offset);
              g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
              osc.connect(g); g.connect(this.ctx.destination);
              osc.start(now + offset); osc.stop(now + offset + 0.07);
            });
          }
        } catch (e) {}
      }
    };

    function showToast(msg, type = "info") {

    function renderToastInner() {
      if (!state.toastMessage) return "";

    function copyTextSafe(text, label = "Kopyalandı!") {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast("📋 " + label, "success");
          }).catch(() => fallbackCopyText(text, label));
          return;
        }
      } catch (e) {}
      fallbackCopyText(text, label);
    }

    function fallbackCopyText(text, label) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("📋 " + label, "success");
      } catch (e) {
        showToast("Kod: " + text, "info");
      }
    }

    function getRandomHand(excludeIds = []) {
      const pool = MEME_CARDS.filter(c => !excludeIds.includes(c.id));
      const sitTags = detectSituationTags(state.currentSituation);
      const packTags = PACK_PREFERRED_TAGS[state.selectedPack] || [];
      const targetTags = Array.from(new Set([...sitTags, ...packTags]));

      if (targetTags.length > 0) {
        const matching = pool.filter(c => Array.isArray(c.tags) && c.tags.some(t => targetTags.includes(t)));
        const others = pool.filter(c => !matching.includes(c));
        const shuffledMatch = [...matching].sort(() => Math.random() - 0.5);
        const shuffledOthers = [...others].sort(() => Math.random() - 0.5);
        const picked = [...shuffledMatch.slice(0, 3), ...shuffledOthers.slice(0, 4)];
        return picked.slice(0, 4).sort(() => Math.random() - 0.5);
      }

      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 4);
    }

    function getNextSituation() {
      const packExtras = PACK_EXTRA_SITUATIONS[state.selectedPack] || [];
      const packTags = PACK_PREFERRED_TAGS[state.selectedPack] || [];
      const tagMatchedBase = SITUATIONS.filter(s => {
        const st = detectSituationTags(s);
        return st.some(tag => packTags.includes(tag));
      });
      const prioritizedPool = [...packExtras, ...tagMatchedBase];
      const unusedPrioritized = prioritizedPool.filter(s => !state.usedSituations.includes(s));
      const combinedPool = [...packExtras, ...SITUATIONS];
      const available = combinedPool.filter(s => !state.usedSituations.includes(s));
      const pool = available.length > 0 ? available : combinedPool;

      let chosen;
      if (unusedPrioritized.length > 0 && Math.random() < 0.72) {
        chosen = unusedPrioritized[Math.floor(Math.random() * unusedPrioritized.length)];
      } else {
        chosen = pool[Math.floor(Math.random() * pool.length)];
      }
      state.usedSituations.push(chosen);
      return chosen;
    }

    function getCurrentPackInfo() {
      for (const s of SERIES_DATA) {
        const found = s.packs.find(p => p.id === state.selectedPack);
        if (found) return { series: s, pack: found };
      }
      return { series: SERIES_DATA[0], pack: SERIES_DATA[0].packs[0] };
    }

    function spawnEmoji(emoji) {
      const app = document.getElementById("app");
      if (!app) return;
      const el = document.createElement("div");
      el.className = "flying-emoji";
      el.style.left = (15 + Math.random() * 70) + "%";
      el.textContent = emoji;
      app.appendChild(el);
      SoundFX.play("tick");
      setTimeout(() => el.remove(), 1700);

      if (state.mode === "online") {
        broadcastRoomEvent("emoji", { emoji });
      }
    }

    function updateTimerDOMOnly() {
      const badgeEl = document.getElementById("topHeaderBadge");
      const circleValEl = document.getElementById("liveTimerCircleVal");
      const circleWrapEl = document.getElementById("liveTimerCircleWrap");
      const waitingFootEl = document.getElementById("waitingTimerFooter");
      const revealTextEl = document.getElementById("revealTimerText");
      const revealBarEl = document.getElementById("revealTimerBar");
      const botLobbyNumEl = document.getElementById("botLobbyCountdownNum");
      const botLobbyFootEl = document.getElementById("botLobbyCountdownFoot");
      const customPromptBadgeEl = document.getElementById("customPromptTimerBadge");

      if (state.screen === "bot_lobby") {
        if (botLobbyNumEl) botLobbyNumEl.textContent = String(state.botLobbyTimer);
        if (botLobbyFootEl) botLobbyFootEl.textContent = `⏳ ${state.botLobbyTimer} saniye sonra otomatik başlıyor...`;
        return;
      }
      if (state.screen === "custom_prompt") {
        if (customPromptBadgeEl) customPromptBadgeEl.textContent = `✍️ ÖZEL GRUP TURU (${state.timer} SN)`;
        return;
      }
      if (state.screen === "picking") {
        if (circleValEl) circleValEl.textContent = String(state.timer);
        if (circleWrapEl) {
          circleWrapEl.className = `w-12 h-12 md:w-14 md:h-14 rounded-full border-2 ${state.timer <= 5 ? 'border-rose-400 text-rose-300 animate-pulse' : 'border-amber-400 text-white'} flex flex-col items-center justify-center shrink-0 bg-black/35`;
        }
        return;
      }
      if (state.screen === "waiting_picks") {
        if (badgeEl) badgeEl.textContent = `${state.currentRound}. TUR • ${state.timer} SN`;
        if (waitingFootEl) waitingFootEl.textContent = `⏱ Oylamanın başlamasına ${state.timer} saniye...`;
        return;
      }
      if (state.screen === "voting") {
        if (badgeEl) badgeEl.textContent = `⏱ ${state.timer} SN OYLAMA`;
        return;
      }
      if (state.screen === "reveal") {
        if (revealTextEl) revealTextEl.textContent = `${state.timer} sn içinde sonraki tura otomatik geçiliyor...`;
        if (revealBarEl) revealBarEl.style.width = `${Math.max(0, (state.timer / 6) * 100)}%`;
        return;
      }
      if (state.screen === "sudden_death") {
        if (badgeEl) badgeEl.textContent = `⚡ ALTIN TUR • ${state.timer} SN`;
      }
    }

    // =========================================================================
    // 8. ANA MENÜYE ÇIKIŞ (SOL ÜST KONSOL LOGOSU VEYA SAĞ ÜST ÇIKIŞ İKONU)
    // =========================================================================
    function requestExitToMenu() {
      if (state.screen === "home") return;
      if (["howto", "profile", "online_choice", "join_room", "setup_score", "setup_category", "setup_pack"].includes(state.screen)) {
        confirmExitToMenu();
        return;
      }
      state.showExitModal = true;
      render();
    }

    async function confirmExitToMenu() {
      clearAllTimers();
      if (state.mode === "online" && state.roomCode && sb) {
        try {
          await sb.from("players").delete().eq("id", state.myId);
        } catch (e) {}
      }
      if (realtimeChannel && sb) {
        try { sb.removeChannel(realtimeChannel); } catch (e) {}
        realtimeChannel = null;
      }
      state.showExitModal = false;
      state.zoomedCardId = null;
      state.roomCode = "";
      state.joinInput = "";
      state.currentRound = 1;
      state.jokerRefreshUsed = false;
      state.jokerDoubleUsed = false;
      state.jokerDoubleActive = false;
      state.screen = "home";
      render();
    }

    // =========================================================================
    // 9. BOT MODU (ALİ, MEHMET, OSMAN) VE TAM 10 SANİYE LOBİ SAYACI
    // =========================================================================

        { id: "bot_ali", name: "Ali", avatar: "🤖", is_admin: false, is_bot: true, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 1, max_votes_in_single_round: 0 },
        { id: "bot_mehmet", name: "Mehmet", avatar: "🤖", is_admin: false, is_bot: true, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 0, max_votes_in_single_round: 0 },
        { id: "bot_osman", name: "Osman", avatar: "🤖", is_admin: false, is_bot: true, score: 0, selected_card_id: null, voted_for_player_id: null, joker_double_active: false, zero_vote_rounds: 0, last_second_picks: 0, max_votes_in_single_round: 0 }

    // =========================================================================
    // 10. ÇEVRİMİÇİ (SUPABASE + BROADCAST YEDEKLİ) ODA KURMA & KATILMA (ADMİN SİSTEMİ)
    // =========================================================================
    function saveLocalRoomSnapshot() {
      if (!state.roomCode) return;
      try {
        const snapshot = {
          code: state.roomCode,
          admin_id: state.isAdmin ? state.myId : (state.players.find(p => p.is_admin)?.id || ""),
          status: state.screen,
          target_score: state.targetScore,
          main_category: state.selectedCategory,
          sub_pack: state.selectedPack,
          current_round: state.currentRound,
          current_situation: state.currentSituation,
          timer: state.timer,
          players: state.players,
          updatedAt: Date.now()
        };
        localStorage.setItem("modunu_bul_room_" + state.roomCode, JSON.stringify(snapshot));
      } catch (e) {}
    }

    function broadcastRoomEvent(eventType, payload = {}) {
      if (!state.roomCode) return;
      saveLocalRoomSnapshot();
      try {
        if (localBus) {
          localBus.postMessage({ roomCode: state.roomCode, eventType, payload, senderId: state.myId });
        }
      } catch (e) {}
      if (realtimeChannel) {
        try {
          realtimeChannel.send({
            type: "broadcast",
            event: eventType,
            payload: { ...payload, senderId: state.myId }
          });
        } catch (e) {}
      }
    }

    if (localBus) {
      localBus.onmessage = (ev) => {
        const msg = ev.data;
        if (!msg || msg.roomCode !== state.roomCode || msg.senderId === state.myId) return;
        handleIncomingRoomBroadcast(msg.eventType, msg.payload);
      };
    }

    function handleIncomingRoomBroadcast(eventType, payload) {
      if (eventType === "emoji" && payload.emoji) {
        const app = document.getElementById("app");
        if (!app) return;
        const el = document.createElement("div");
        el.className = "flying-emoji";
        el.style.left = (15 + Math.random() * 70) + "%";
        el.textContent = payload.emoji;
        app.appendChild(el);
        setTimeout(() => el.remove(), 1700);
      } else if (eventType === "player_joined" && payload.player) {
        const exists = state.players.some(p => p.id === payload.player.id);
        if (!exists) {
          state.players.push(payload.player);
          showToast(`👋 ${payload.player.name} odaya katıldı!`, "success");
          render();
        }
        if (state.isAdmin) {
          broadcastRoomEvent("room_sync", {
            targetScore: state.targetScore,
            selectedCategory: state.selectedCategory,
            selectedPack: state.selectedPack,
            currentRound: state.currentRound,
            currentSituation: state.currentSituation,
            players: state.players,
            screen: state.screen
          });
        }
      } else if (eventType === "room_sync" && !state.isAdmin) {
        state.targetScore = payload.targetScore || state.targetScore;
        state.selectedCategory = payload.selectedCategory || state.selectedCategory;
        state.selectedPack = payload.selectedPack || state.selectedPack;
        state.currentRound = payload.currentRound || state.currentRound;
        state.currentSituation = payload.currentSituation || state.currentSituation;
        if (Array.isArray(payload.players)) state.players = payload.players;
        if (payload.screen === "round_intro" && state.screen === "lobby") {
          proceedToRoundIntro();
        } else {
          render();
        }
      } else if (eventType === "card_picked" && payload.playerId) {
        const p = state.players.find(x => x.id === payload.playerId);
        if (p) {
          p.selected_card_id = payload.cardId;
          p.joker_double_active = payload.jokerDoubleActive;
          if (state.screen === "waiting_picks") render();
        }
      } else if (eventType === "vote_cast" && payload.playerId) {
        const p = state.players.find(x => x.id === payload.playerId);
        if (p) p.voted_for_player_id = payload.targetPlayerId;
      }
    }

    async function createOnlineRoom() {
      let code = state.customRoomCodeInput && state.customRoomCodeInput.length === 6
        ? state.customRoomCodeInput
        : String(Math.floor(100000 + Math.random() * 900000));

      state.roomCode = code;
      state.isAdmin = true;
      state.currentRound = 1;
      state.usedSituations = [];
      const firstSituation = getNextSituation();
      state.currentSituation = firstSituation;

      state.players = [
        {
          id: state.myId,
          room_code: code,
          name: state.playerName.trim(),
          avatar: state.playerAvatar,
          is_admin: true,
          is_bot: false,
          score: 0,
          selected_card_id: null,
          voted_for_player_id: null,
          joker_double_active: false
        }
      ];

      saveLocalRoomSnapshot();

      if (sb) {
        try {
          await sb.from("rooms").upsert({
            code: code,
            admin_id: state.myId,
            status: "lobby",
            target_score: state.targetScore,
            main_category: state.selectedCategory,
            sub_pack: state.selectedPack,
            current_round: 1,
            current_situation: firstSituation
          });

          await sb.from("players").upsert({
            id: state.myId,
            room_code: code,
            name: state.playerName.trim(),
            avatar: state.playerAvatar,
            is_admin: true,
            is_bot: false,
            score: 0
          });

          subscribeToRoom(code);
          await fetchRoomData(code);
        } catch (err) {}
      }

      state.screen = "lobby";
      showToast("👑 6 haneli odan kuruldu! Kod: " + code, "success");
      render();
    }

    function addBotToOnlineLobby() {
      if (!state.isAdmin || state.players.length >= 8) return;
      const botNames = ["Ali", "Mehmet", "Osman", "Zeynep", "Can", "Elif"];
      const existingNames = state.players.map(p => p.name);
      const nextBotName = botNames.find(n => !existingNames.includes(n)) || ("Bot_" + (state.players.length));
      const newBot = {
        id: "bot_" + nextBotName.toLowerCase() + "_" + Math.floor(Math.random() * 999),
        room_code: state.roomCode,
        name: nextBotName,
        avatar: "🤖",
        is_admin: false,
        is_bot: true,
        score: 0,
        selected_card_id: null,
        voted_for_player_id: null,
        joker_double_active: false
      };
      state.players.push(newBot);
      saveLocalRoomSnapshot();
      broadcastRoomEvent("room_sync", {
        targetScore: state.targetScore,
        selectedCategory: state.selectedCategory,
        selectedPack: state.selectedPack,
        currentRound: state.currentRound,
        currentSituation: state.currentSituation,
        players: state.players,
        screen: state.screen
      });
      showToast(`🤖 ${nextBotName} odaya eklendi!`, "info");
      render();
    }

    async function joinOnlineRoom() {
      if (state.joinInput.length !== 6 || !/^[0-9]{6}$/.test(state.joinInput)) {
        state.joinError = "Lütfen sadece rakamlardan oluşan 6 haneli oda kodunu girin.";
        render();
        return;
      }

      const code = state.joinInput;
      state.joinError = "";

      try {
        const localRaw = localStorage.getItem("modunu_bul_room_" + code);
        if (localRaw) {
          const localRoom = JSON.parse(localRaw);
          state.roomCode = code;
          state.isAdmin = false;
          state.targetScore = localRoom.target_score || 5000;
          state.selectedCategory = localRoom.main_category || "mizah";
          state.selectedPack = localRoom.sub_pack || "turk_mizah";
          state.currentRound = localRoom.current_round || 1;
          state.currentSituation = localRoom.current_situation || SITUATIONS[0];
          state.players = Array.isArray(localRoom.players) ? localRoom.players : [];

          const meObj = {
            id: state.myId,
            room_code: code,
            name: state.playerName.trim(),
            avatar: state.playerAvatar,
            is_admin: false,
            is_bot: false,
            score: 0,
            selected_card_id: null,
            voted_for_player_id: null,
            joker_double_active: false
          };
          if (!state.players.some(p => p.id === state.myId)) {
            state.players.push(meObj);
          }
          saveLocalRoomSnapshot();
          broadcastRoomEvent("player_joined", { player: meObj });
          if (sb) subscribeToRoom(code);
          state.screen = "lobby";
          showToast("🚪 Odaya başarıyla katıldın!", "success");
          render();
          return;
        }
      } catch (e) {}

      if (sb) {
        try {
          const { data: room, error } = await sb.from("rooms").select("*").eq("code", code).single();
          if (!error && room) {
            state.roomCode = room.code;
            state.isAdmin = false;
            state.targetScore = room.target_score || 5000;
            state.selectedCategory = room.main_category || "mizah";
            state.selectedPack = room.sub_pack || "turk_mizah";

            await sb.from("players").upsert({
              id: state.myId,
              room_code: room.code,
              name: state.playerName.trim(),
              avatar: state.playerAvatar,
              is_admin: false,
              is_bot: false,
              score: 0
            });

            subscribeToRoom(room.code);
            await fetchRoomData(room.code);
            state.screen = "lobby";
            showToast("🚪 Odaya başarıyla katıldın!", "success");
            render();
            return;
          }
        } catch (e) {}
      }

      state.joinError = "Bu 6 haneli koda ait aktif bir oda bulunamadı! Önce Admin'in odayı kurduğundan emin olun.";
      render();
    }

    async function fetchRoomData(code) {
      if (!sb) return;
      try {
        const { data: room } = await sb.from("rooms").select("*").eq("code", code).single();
        const { data: players } = await sb.from("players").select("*").eq("room_code", code).order("joined_at", { ascending: true });
        if (players && players.length > 0) state.players = players;
        if (room) {
          state.targetScore = room.target_score || state.targetScore;
          state.selectedCategory = room.main_category || state.selectedCategory;
          state.selectedPack = room.sub_pack || state.selectedPack;
          state.currentRound = room.current_round || state.currentRound;
          state.currentSituation = room.current_situation || SITUATIONS[0];
          syncOnlineScreenWithStatus(room.status);
        }
      } catch (e) {}
    }

    function subscribeToRoom(code) {
      if (!sb) return;
      if (realtimeChannel) {
        try { sb.removeChannel(realtimeChannel); } catch (e) {}
      }
      realtimeChannel = sb.channel("room_" + code)
        .on("postgres_changes", { event: "*", schema: "public", table: "rooms", filter: "code=eq." + code }, () => {
          fetchRoomData(code);
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: "room_code=eq." + code }, () => {
          fetchRoomData(code);
        })
        .on("broadcast", { event: "emoji" }, payload => {
          if (payload.payload && payload.payload.emoji) {
            handleIncomingRoomBroadcast("emoji", payload.payload);
          }
        })
        .on("broadcast", { event: "room_sync" }, payload => {
          if (payload.payload) handleIncomingRoomBroadcast("room_sync", payload.payload);
        })
        .on("broadcast", { event: "card_picked" }, payload => {
          if (payload.payload) handleIncomingRoomBroadcast("card_picked", payload.payload);
        })
        .on("broadcast", { event: "vote_cast" }, payload => {
          if (payload.payload) handleIncomingRoomBroadcast("vote_cast", payload.payload);
        })
        .subscribe();
    }

    function syncOnlineScreenWithStatus(status) {
      if (status === "lobby" && state.screen !== "lobby" && state.screen !== "qr_modal") {
        state.screen = "lobby";
        render();
      } else if (status === "picking" && !["round_intro", "picking", "waiting_picks", "timeout_pass"].includes(state.screen)) {
        beginPickingPhaseUI();
      } else if (status === "voting" && state.screen !== "voting") {
        beginVotingPhaseUI();
      } else if (status === "reveal" && state.screen !== "reveal") {
        beginRevealPhaseUI();
      } else if (status === "finished" && !["podium", "badges", "story_card"].includes(state.screen)) {
        state.screen = "podium";
        render();
      } else {
        render();
      }
    }

    // =========================================================================
    // 11. OYUN DÖNGÜSÜ: TUR BAŞLANGICI, 20 SN KART SEÇİMİ, 10 SN OYLAMA, +300 PUAN
    // =========================================================================
    async function startNewRound() {
      clearAllTimers();
      state.selectedCardId = null;
      state.hasSubmittedCard = false;
      state.votedPlayerId = null;
      state.jokerDoubleActive = false;
      state.zoomedCardId = null;

      if (state.mode === "online" && state.players.length < 2) {
        ["Ali", "Mehmet", "Osman"].forEach(bName => {
          state.players.push({
            id: "bot_" + bName.toLowerCase(),
            room_code: state.roomCode,
            name: bName,
            avatar: "🤖",
            is_admin: false,
            is_bot: true,
            score: 0,
            selected_card_id: null,
            voted_for_player_id: null,
            joker_double_active: false
          });
        });
      }

      state.players.forEach(p => {
        p.selected_card_id = null;
        p.voted_for_player_id = null;
        p.joker_double_active = false;
      });

      if (state.currentRound > 1 && state.currentRound % 5 === 0 && state.isAdmin) {
        state.customPromptText = "";
        state.screen = "custom_prompt";
        state.timer = 15;
        render();
        mainInterval = setInterval(() => {
          state.timer--;
          if (state.timer <= 0) {
            clearAllTimers();
            state.currentSituation = state.customPromptText.trim() || getNextSituation();
            proceedToRoundIntro();
          } else {
            updateTimerDOMOnly();
          }
        }, 1000);
        return;
      }

      state.currentSituation = getNextSituation();
      proceedToRoundIntro();
    }

    async function proceedToRoundIntro() {
      clearAllTimers();
      state.hand = getRandomHand();
      if (state.mode === "online" && state.isAdmin) {
        broadcastRoomEvent("room_sync", {
          targetScore: state.targetScore,
          selectedCategory: state.selectedCategory,
          selectedPack: state.selectedPack,
          currentRound: state.currentRound,
          currentSituation: state.currentSituation,
          players: state.players,
          screen: "round_intro"
        });
        if (sb) {
          try {
            await sb.from("players").update({ selected_card_id: null, voted_for_player_id: null, joker_double_active: false }).eq("room_code", state.roomCode);
            await sb.from("rooms").update({
              status: "picking",
              current_round: state.currentRound,
              current_situation: state.currentSituation
            }).eq("code", state.roomCode);
          } catch (e) {}
        }
      }

      state.screen = "round_intro";
      render();
      const introTid = setTimeout(() => {
        beginPickingPhaseUI();
      }, 1600);
      botTimeoutIds.push(introTid);
    }

    function beginPickingPhaseUI() {
      clearAllTimers();
      if (state.hand.length === 0) state.hand = getRandomHand();
      state.selectedCardId = null;
      state.hasSubmittedCard = false;
      state.votedPlayerId = null;
      state.zoomedCardId = null;
      state.timer = 20;
      state.screen = "picking";
      render();

      const bots = state.players.filter(p => p.is_bot);
      bots.forEach((bot, idx) => {
        const delay = (idx === 0 ? 3000 : idx === 1 ? 6000 : 9500);
        const tid = setTimeout(() => {
          const usedIds = [
            ...state.hand.map(h => h.id),
            ...state.players.map(p => p.selected_card_id).filter(Boolean)
          ];
          const available = MEME_CARDS.filter(c => !usedIds.includes(c.id));
          const randomCard = available[Math.floor(Math.random() * available.length)] || MEME_CARDS[(idx * 3) % MEME_CARDS.length];
          bot.selected_card_id = randomCard.id;
          const pBadge = document.getElementById("pstatus_" + bot.id);
          if (pBadge) pBadge.textContent = "✔";
          if (state.screen === "waiting_picks") render();
        }, delay);
        botTimeoutIds.push(tid);
      });

      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 5 && state.timer > 0) SoundFX.play("heartbeat");
        else if (state.timer > 5) SoundFX.play("tick");

        if (state.timer <= 0) {
          clearAllTimers();
          const currentUsed = state.players.map(p => p.selected_card_id).filter(Boolean);
          state.players.filter(p => p.is_bot).forEach((bot, idx) => {
            if (!bot.selected_card_id) {
              const avail = MEME_CARDS.filter(c => !currentUsed.includes(c.id));
              const fallback = avail[idx % avail.length] || MEME_CARDS[(idx + 4) % MEME_CARDS.length];
              bot.selected_card_id = fallback.id;
              currentUsed.push(fallback.id);
            }
          });

          if (!state.hasSubmittedCard) {
            state.screen = "timeout_pass";
            render();
            const passTid = setTimeout(() => {
              triggerVotingPhase();
            }, 2200);
            botTimeoutIds.push(passTid);
          } else {
            triggerVotingPhase();
          }
        } else {
          updateTimerDOMOnly();
        }
      }, 1000);
    }

    async function submitSelectedCard() {
      if (!state.selectedCardId || state.hasSubmittedCard) return;
      state.hasSubmittedCard = true;
      state.zoomedCardId = null;
      if (state.jokerDoubleActive) state.jokerDoubleUsed = true;

      const me = state.players.find(p => p.id === state.myId);
      if (me) {
        me.selected_card_id = state.selectedCardId;
        me.joker_double_active = state.jokerDoubleActive;
        if (state.timer <= 3) me.last_second_picks = (me.last_second_picks || 0) + 1;
      }

      if (state.mode === "online") {
        broadcastRoomEvent("card_picked", {
          playerId: state.myId,
          cardId: state.selectedCardId,
          jokerDoubleActive: state.jokerDoubleActive
        });
        if (sb) {
          try {
            await sb.from("players").update({
              selected_card_id: state.selectedCardId,
              joker_double_active: state.jokerDoubleActive
            }).eq("id", state.myId);

    async function triggerVotingPhase() {
      if (state.mode === "online" && state.isAdmin && sb) {
        try {
          await sb.from("rooms").update({ status: "voting" }).eq("code", state.roomCode);
        } catch (e) {}
      }
      beginVotingPhaseUI();
    }

    function beginVotingPhaseUI() {
      clearAllTimers();
      state.votedPlayerId = null;
      state.zoomedCardId = null;
      state.timer = 10;
      state.screen = "voting";
      render();

      const activePlayers = state.players.filter(p => p.selected_card_id);
      state.players.filter(p => p.is_bot).forEach((bot, i) => {
        const tid = setTimeout(() => {
          const candidates = activePlayers.filter(p => p.id !== bot.id);
          if (candidates.length > 0) {
            const target = candidates[Math.floor(Math.random() * candidates.length)];
            bot.voted_for_player_id = target.id;
          }
        }, 1800 + i * 1600);
        botTimeoutIds.push(tid);
      });

      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 4 && state.timer > 0) SoundFX.play("heartbeat");
        else if (state.timer > 4) SoundFX.play("tick");

        if (state.timer <= 0) {
          clearAllTimers();
          state.players.filter(p => p.is_bot).forEach(bot => {
            if (!bot.voted_for_player_id) {
              const candidates = activePlayers.filter(p => p.id !== bot.id);
              if (candidates.length > 0) {
                bot.voted_for_player_id = candidates[Math.floor(Math.random() * candidates.length)].id;
              }
            }
          });
          triggerRevealPhase();
        } else {
          updateTimerDOMOnly();
        }
      }, 1000);
    }

    async function castVote(targetPlayerId) {
      if (!state.hasSubmittedCard || state.votedPlayerId || targetPlayerId === state.myId) return;
      state.votedPlayerId = targetPlayerId;
      const me = state.players.find(p => p.id === state.myId);
      if (me) me.voted_for_player_id = targetPlayerId;
      SoundFX.play("tick");

      if (state.mode === "online") {
        broadcastRoomEvent("vote_cast", { playerId: state.myId, targetPlayerId });
        if (sb) {
          try {
            await sb.from("players").update({ voted_for_player_id: targetPlayerId }).eq("id", state.myId);
          } catch (e) {}
        }
      }
      render();
    }

    async function triggerRevealPhase() {
      const voteCounts = {};
      state.players.forEach(p => { voteCounts[p.id] = 0; });
      state.players.forEach(p => {
        if (p.voted_for_player_id && voteCounts[p.voted_for_player_id] !== undefined) {
          voteCounts[p.voted_for_player_id]++;
        }
      });

      state.players.forEach(p => {
        const votes = voteCounts[p.id] || 0;
        p.roundVotes = votes;
        let delta = votes * 300;
        if (p.joker_double_active) {
          delta = votes > 0 ? votes * 600 : -300;
        }
        p.roundDelta = delta;
        p.score = Math.max(0, (p.score || 0) + delta);

        if (votes === 0) p.zero_vote_rounds = (p.zero_vote_rounds || 0) + 1;
        if (votes > (p.max_votes_in_single_round || 0)) p.max_votes_in_single_round = votes;

        if (votes >= (state.bestMoment.votes || 0) && p.selected_card_id) {
          state.bestMoment = {
            situation: state.currentSituation,
            card: getCardById(p.selected_card_id),
            winnerName: p.name,
            votes: votes
          };
        }
      });

      if (state.mode === "online" && state.isAdmin && sb) {
        try {
          for (const p of state.players) {
            await sb.from("players").update({ score: p.score }).eq("id", p.id);
          }
          await sb.from("rooms").update({ status: "reveal" }).eq("code", state.roomCode);
        } catch (e) {}
      }

      beginRevealPhaseUI();
    }

    function beginRevealPhaseUI() {
      clearAllTimers();
      state.screen = "reveal";
      state.timer = 6;

      const anyVotes = state.players.some(p => (p.roundVotes || 0) > 0);
      SoundFX.play(anyVotes ? "applause" : "cricket");
      render();

      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 0) {
          clearAllTimers();
          checkEndOfGameOrNextRound();
        } else {
          updateTimerDOMOnly();
        }
      }, 1000);
    }

    async function checkEndOfGameOrNextRound() {
      const winners = state.players.filter(p => p.score >= state.targetScore);
      if (winners.length > 1) {
        const sorted = [...winners].sort((a, b) => b.score - a.score);
        if (sorted[0].score === sorted[1].score) {
          state.suddenDeathFinalists = [sorted[0], sorted[1]];
          startSuddenDeathDuel();
          return;
        }
      }
      if (winners.length >= 1) {
        if (state.mode === "online" && state.isAdmin && sb) {
          try {
            await sb.from("rooms").update({ status: "finished" }).eq("code", state.roomCode);
          } catch (e) {}
        }
        SoundFX.play("applause");
        state.screen = "podium";
        render();
        return;
      }

      state.currentRound++;
      startNewRound();
    }

    function startSuddenDeathDuel() {
      clearAllTimers();
      state.screen = "sudden_death";
      state.timer = 8;
      state.currentSituation = getNextSituation();
      render();

      mainInterval = setInterval(() => {
        state.timer--;
        if (state.timer <= 0) {
          clearAllTimers();
          state.suddenDeathFinalists[0].score += 300;
          state.screen = "podium";
          SoundFX.play("applause");
          render();
        } else {
          updateTimerDOMOnly();
        }
      }, 1000);
    }

    function downloadStoryCard() {
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, 0, 1920);
      grad.addColorStop(0, "#2E1065");
      grad.addColorStop(0.5, "#0F172A");
      grad.addColorStop(1, "#09090F");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.fillStyle = "#C084FC";
      ctx.font = "bold 46px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🎮 MODUNU BUL • MAÇIN EFSANE ANI", 540, 220);

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(90, 320, 900, 320);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 40px sans-serif";
      ctx.fillText(state.bestMoment.situation.slice(0, 44), 540, 450);
      if (state.bestMoment.situation.length > 44) {
        ctx.fillText(state.bestMoment.situation.slice(44, 88), 540, 515);
      }

      ctx.font = "200px sans-serif";
      ctx.fillText(state.bestMoment.card.emoji, 540, 1040);

      ctx.fillStyle = "#FBBF24";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("👑 Kazanan: " + state.bestMoment.winnerName + " (+" + ((state.bestMoment.votes || 1) * 300) + " Puan)", 540, 1470);

      ctx.fillStyle = "#71717A";
      ctx.font = "32px sans-serif";
      ctx.fillText("© 2026 Modunu Bul.", 540, 1780);

      const link = document.createElement("a");
      link.download = "modunu-bul-efsane-an.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("📸 Hikaye kartı PNG olarak indirildi!", "success");
    }

                <span>👑</span> <span>1. ŞAMPİYON</span>
              </div>
              <div class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-purple-500/30 neon-border-purple flex items-center justify-center text-3xl md:text-4xl shadow-xl">${first.avatar}</div>
              <div class="text-sm md:text-base font-extrabold text-amber-300 mt-2 truncate max-w-full px-1">${first.name}</div>
              <div class="text-xs md:text-sm text-white font-extrabold mb-1.5">${first.score} Puan</div>
              <div class="w-full h-28 md:h-32 rounded-t-2xl bg-gradient-to-b from-purple-600/85 to-indigo-950 neon-border-purple flex flex-col items-center justify-center">
                <span class="text-3xl font-extrabold text-white">1</span>
                <span class="text-[9px] text-purple-200 font-extrabold tracking-wider">BİRİNCİ</span>
              </div>
            </div>

            <!-- 3. Oyuncu -->
            <div class="flex flex-col items-center">
              <span class="text-xs font-extrabold text-amber-600 mb-1">🥉 3.</span>
              <div class="w-12 h-12 md:w-14 md:h-14 rounded-full glass-card border-2 border-amber-700/70 flex items-center justify-center text-xl md:text-2xl">${third.avatar}</div>
              <div class="text-xs md:text-sm font-extrabold text-white mt-2 truncate max-w-full px-1">${third.name}</div>
              <div class="text-[10px] md:text-xs text-zinc-300 font-extrabold mb-1.5">${third.score} Puan</div>
              <div class="w-full h-16 md:h-20 rounded-t-2xl glass-card border-t-2 border-t-amber-700/70 flex flex-col items-center justify-center">
                <span class="text-xl md:text-2xl font-extrabold text-amber-500">3</span>
                <span class="text-[8px] md:text-[9px] text-zinc-400 font-bold">ÜÇÜNCÜ</span>
              </div>
            </div>
          </div>

          <div class="w-full max-w-xl mx-auto space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="state.screen='badges'; render();" class="py-3 rounded-xl glass-card text-[11px] md:text-xs font-bold text-purple-300">🏅 Gece Rozetleri</button>
              <button onclick="state.screen='story_card'; render();" class="py-3 rounded-xl glass-card text-[11px] md:text-xs font-bold text-sky-300">📸 Efsane An</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="confirmExitToMenu()" class="py-3 rounded-xl glass-card text-xs md:text-sm font-bold">Ana Menü</button>
              <button onclick="state.players.forEach(p=>p.score=0); state.currentRound=1; if(state.mode==='bot'){ startBotLobby(); } else { startNewRound(); }" class="py-3 rounded-xl btn-primary text-xs md:text-sm">↻ Tekrar Oyna</button>
            </div>
          </div>
        `;
      }

      // 21. MAÇ SONU ROZETLER EKRANI
      else if (state.screen === "badges") {
        const sortedByScore = [...state.players].sort((a, b) => b.score - a.score);
        const mizahsor = sortedByScore[0] || state.players[0];
        const sonSaniye = [...state.players].sort((a, b) => (b.last_second_picks || 0) - (a.last_second_picks || 0))[0] || state.players[0];
        const buzdolabi = [...state.players].sort((a, b) => (b.zero_vote_rounds || 0) - (a.zero_vote_rounds || 0))[0] || state.players[0];

        html += `
          <div class="flex items-center justify-between">
            <button onclick="state.screen='podium'; render();" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">←</button>
            <span class="text-xs md:text-sm font-bold">🏅 Maç Sonu Unvanları</span>
            <button onclick="requestExitToMenu()" class="w-8 h-8 rounded-full glass-card neon-border-purple flex items-center justify-center text-xs">🎮</button>
          </div>

          <div class="w-full max-w-xl mx-auto space-y-3 my-auto">
            <div class="p-4 rounded-2xl glass-card neon-border-purple flex items-center gap-3">
              <div class="text-3xl">🎯</div>
              <div>
                <div class="text-xs md:text-sm font-extrabold text-purple-300">Gecenin Mizahşörü • ${mizahsor.name}</div>
                <p class="text-[10px] md:text-xs text-zinc-400">En yüksek oyları toplayarak masayı kahkahaya boğdu.</p>
              </div>
            </div>
            <div class="p-4 rounded-2xl glass-card neon-border-emerald flex items-center gap-3">
              <div class="text-3xl">🐢</div>
              <div>
                <div class="text-xs md:text-sm font-extrabold text-emerald-300">Son Saniye Uzmanı • ${sonSaniye.name}</div>
                <p class="text-[10px] md:text-xs text-zinc-400">Kartlarını son saniyelerde göndererek heyecan yarattı.</p>
              </div>
            </div>
            <div class="p-4 rounded-2xl glass-card neon-border-blue flex items-center gap-3">
              <div class="text-3xl">🧊</div>
              <div>
                <div class="text-xs md:text-sm font-extrabold text-sky-300">Buzdolabı • ${buzdolabi.name}</div>
                <p class="text-[10px] md:text-xs text-zinc-400">En çok 0 oy çekerek masayı derin düşüncelere sevk etti.</p>
              </div>
            </div>
          </div>

          <div class="w-full max-w-xl mx-auto">
            <button onclick="state.screen='podium'; render();" class="w-full py-3.5 rounded-2xl btn-primary text-xs md:text-sm">← Podyuma Geri Dön</button>
          </div>
        `;
      }

      // 22. EFSANE AN PAYLAŞIM KARTI EKRANI
      else if (state.screen === "story_card") {
        html += `
          <div class="flex items-center justify-between">
            <button onclick="state.screen='podium'; render();" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">←</button>
            <span class="text-xs md:text-sm font-bold">📸 Maçın Efsane Anı</span>
            <button onclick="requestExitToMenu()" class="w-8 h-8 rounded-full glass-card neon-border-purple flex items-center justify-center text-xs">🎮</button>
          </div>

          <div class="w-full max-w-md mx-auto my-auto p-5 rounded-3xl bg-gradient-to-b from-purple-900/90 via-indigo-950 to-zinc-950 neon-border-purple space-y-3 text-center">
            <div class="flex justify-between text-[10px] text-purple-200 font-bold">
              <span>🎮 MODUNU BUL • 2026</span>
              <span class="px-2 py-0.5 rounded-full bg-amber-400 text-black font-extrabold">🔥 EN KOMİK AN</span>
            </div>
            <div class="p-3 rounded-xl bg-black/40 text-left text-xs font-bold">"${state.bestMoment.situation}"</div>
            ${renderMemeIllustration(state.bestMoment.card, false)}
            <div class="flex justify-between text-xs pt-2 border-t border-white/10">
              <span class="font-extrabold text-amber-300">👑 ${state.bestMoment.winnerName}</span>
              <span class="text-emerald-400 font-extrabold">+${(state.bestMoment.votes || 1) * 300} Puan</span>
            </div>
          </div>

          <div class="w-full max-w-md mx-auto space-y-2">
            <button onclick="downloadStoryCard()" class="w-full py-3.5 rounded-2xl btn-primary text-xs md:text-sm">📸 Hikaye Kartını İndir (PNG)</button>
            <button onclick="state.screen='podium'; render();" class="w-full py-2.5 rounded-xl glass-card text-xs">← Podyuma Geri Dön</button>
          </div>
        `;
      }

      html += `</div>`;

      // MEME GÖRSELİ BÜYÜTME (LIGHTBOX) MODAL
      if (state.zoomedCardId) {
        const zCard = getCardById(state.zoomedCardId);
        html += `
          <div onclick="closeZoomModal()" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div onclick="event.stopPropagation()" class="w-full max-w-md p-4 rounded-3xl glass-card neon-border-blue space-y-3 animate-screen">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-sky-300">🔍 Meme Kartı Önizleme</span>
                <button onclick="closeZoomModal()" class="w-8 h-8 rounded-full glass-card text-xs font-bold text-rose-400">✕</button>
              </div>
              <div class="w-full h-72 md:h-96 rounded-2xl bg-zinc-950 relative overflow-hidden flex items-center justify-center border border-white/15">
                <span class="text-6xl">${Array.from(zCard.emoji || '🎭')[0]}</span>
                ${zCard.img ? `<img src="${zCard.img}" data-backup="${zCard.backupImg || ''}" alt="Meme" onerror="handleMemeImgError(this)" class="absolute inset-0 w-full h-full object-contain bg-black/80 p-2 z-10" />` : ''}
              </div>
              <button onclick="closeZoomModal()" class="w-full py-2.5 rounded-xl btn-secondary text-xs font-extrabold">Kapat</button>
            </div>
          </div>
        `;
      }

      // ÇIKIŞ ONAYI MODAL (HER EKRANDA AKTİF)
      if (state.showExitModal) {
        html += `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
            <div class="w-full max-w-xs p-5 rounded-3xl glass-card neon-border-purple text-center space-y-3 animate-screen">
              <div class="w-12 h-12 mx-auto rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-2xl">🚪</div>
              <h3 class="text-base font-extrabold">Ana Menüye Dönmek İstediğine Emin Misin?</h3>
              <p class="text-xs text-zinc-400">Aktif oyundan ayrılırsan bu maçtaki puanların sıfırlanır.</p>
              <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="confirmExitToMenu()" class="py-2.5 rounded-xl bg-rose-500 text-black font-extrabold text-xs">Evet, Çık</button>
                <button onclick="state.showExitModal=false; render();" class="py-2.5 rounded-xl glass-card text-white font-bold text-xs">Hayır, Kal</button>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    // Oyunu Başlat
    window.onload = () => {
      render();
    };
  </script>
</body>
</html>
